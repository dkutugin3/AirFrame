plugins { id 'com.android.application' }

android {
    namespace 'video.airframe'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'video.airframe'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.5.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('../signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    testOptions {
        // The profile-defaulting tests instantiate ProjectionService on the JVM and invoke its
        // pure private configure()/defaults paths. Framework methods they never reach (main
        // looper handler setup, etc.) return defaults instead of throwing "not mocked".
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // zxing-android-embedded's CaptureManager calls ContextCompat/ActivityCompat when
    // opening the camera, but ships them as implementation-only: without this line the
    // scanner crashes with NoClassDefFoundError right after the QR button is pressed.
    implementation 'androidx.core:core:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM so unit tests can exercise the signalling settings payload.
    testImplementation 'org.json:json:20240303'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
