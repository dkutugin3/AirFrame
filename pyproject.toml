[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airframe"
version = "0.6.0"
description = "Local WebRTC receiver for the AirFrame Android screen sender"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.13.5,<4", "aiortc==1.15.0", "qrcode>=8,<9", "PySide6>=6.8,<7"]

[project.scripts]
airframe = "airframe.desktop:main"

[tool.setuptools.packages.find]
include = ["airframe*"]

[tool.setuptools.package-data]
airframe = ["assets/*.svg", "assets/*.png", "assets/*.icns", "assets/*.ico"]

